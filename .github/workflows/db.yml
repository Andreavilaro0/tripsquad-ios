name: DB Schema

# Aplica las migraciones contra un Postgres REAL (service container) y corre las
# aserciones del gate G3 (dinero en bigint) + dedupe estructural (ADR-0015 §8).
# No necesita Docker local: GitHub Actions levanta el Postgres.

on:
  push:
    paths: ["db/**", ".github/workflows/db.yml"]
  pull_request:
    paths: ["db/**", ".github/workflows/db.yml"]

jobs:
  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tripsquad
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: tripsquad
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar migraciones
        run: |
          for f in db/migrations/*.sql; do
            echo "== aplicando $f =="
            psql -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Aserciones de esquema (G3 + dedupe)
        run: psql -v ON_ERROR_STOP=1 -f db/tests/schema_assertions.sql
